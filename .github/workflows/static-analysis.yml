name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Validate formatting configuration and source parseability
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src tests benchmarks -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi
          clang-format --style=file --dry-run "${files[@]}"

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang-tidy

      - name: Configure production compile database
        run: |
          cmake -S . -B build-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=OFF \
            -DNN_ENABLE_WARNINGS_AS_ERRORS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build production targets
        run: cmake --build build-tidy --parallel

      - name: Analyze production translation units
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find src benchmarks -type f -name '*.cpp' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No production C++ translation units found."
            exit 1
          fi

          # Use an explicit CI configuration so repository-wide style checks in
          # .clang-tidy cannot accidentally turn unrelated advisory diagnostics
          # into blocking failures. The required gate remains the Clang static
          # analyzer, which fails the job on analyzer findings.
          clang-tidy \
            -p build-tidy \
            --config='{Checks: "-*,clang-analyzer-*", WarningsAsErrors: "clang-analyzer-*", HeaderFilterRegex: "^(.*/)?src/"}' \
            "${files[@]}"

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Analyze production code
        shell: bash
        run: |
          set -euo pipefail
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --std=c++17 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            -Isrc \
            src benchmarks
