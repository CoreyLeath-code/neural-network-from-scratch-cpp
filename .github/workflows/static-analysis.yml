name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Validate formatting configuration and source parseability
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src tests benchmarks -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          # --dry-run verifies that every file can be parsed with the repository's
          # checked-in .clang-format policy without mutating the worktree.
          clang-format --style=file --dry-run "${files[@]}"

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev clang-tidy

      - name: Configure compile database
        run: |
          cmake -S . -B build-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNN_ENABLE_WARNINGS_AS_ERRORS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build analyzed targets
        run: cmake --build build-tidy --parallel

      - name: Analyze production translation units
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find src benchmarks -type f -name '*.cpp' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No production C++ translation units found."
            exit 1
          fi

          # Keep the required gate focused on high-signal correctness checks.
          # Same-typed dimension/count arguments are deliberate in this numerical API,
          # so bugprone-easily-swappable-parameters is explicitly excluded.
          clang-tidy \
            -p build-tidy \
            -header-filter='^(.*/)?src/' \
            -checks='-*,clang-analyzer-*,bugprone-*,-bugprone-easily-swappable-parameters' \
            --warnings-as-errors='clang-analyzer-*,bugprone-*,-bugprone-easily-swappable-parameters' \
            "${files[@]}"

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Analyze production code
        shell: bash
        run: |
          set -euo pipefail
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --std=c++17 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            -Isrc \
            src benchmarks
